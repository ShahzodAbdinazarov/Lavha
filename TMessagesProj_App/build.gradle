apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            // Svipe private upload key (git-ignored; passwords live in ~/.gradle/gradle.properties)
            storeFile file("../TMessagesProj/config/svipe-upload.keystore")
            storePassword project.findProperty('SVIPE_UPLOAD_STORE_PASSWORD') ?: ''
            keyAlias project.findProperty('SVIPE_UPLOAD_KEY_ALIAS') ?: 'svipe-upload'
            keyPassword project.findProperty('SVIPE_UPLOAD_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        bundleAfat_SDK23 {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            minSdkVersion 23
            ext {
                abiVersionCode = 2
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    // Manifest per distribution channel, mirroring upstream Telegram's own split: the Play bundle
    // ships the clean manifest, while the direct-download builds add the flash-call login
    // permissions (READ_CALL_LOG, CALL_PHONE) that Play will not let a non-dialer app keep.
    //
    // These have to be *variant* source sets. A `sourceSets { }` block written inside a
    // productFlavor is not flavor-scoped — it mutates the shared android.sourceSets, so whichever
    // flavor happened to be declared last silently won for every release variant. That is how the
    // Play bundle ended up carrying READ_CALL_LOG while the code read as if it did not.
    sourceSets {
        bundleAfatRelease       { manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml' }
        bundleAfat_SDK23Release { manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml' }
        afatRelease             { manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml' }
        // The .web build reuses the SDK23 release manifest: upstream's AndroidManifest_standalone.xml
        // references *_launcher_sa icons that don't exist in the Svipe rebrand, so .web simply ships
        // the same Svipe icon as Play.
        afatStandalone          { manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml' }
        afatDebug               { manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml' }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            // Play App Bundle (bundleAfat): keep a clean versionCode (Play handles ABI splits).
            // Direct-download APKs keep the *10+abi marker so per-ABI APKs stay distinct/ordered.
            if (variant.productFlavors.get(0).name == "bundleAfat") {
                output.versionCodeOverride = defaultConfig.versionCode
            } else {
                output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
            }
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

apply plugin: 'com.google.gms.google-services'

// The Play bundle must never carry the flash-call login permissions. Nothing in the manifest files
// themselves enforces that — the split lives in the gradle wiring above, and a mis-scoped sourceSets
// block already shipped READ_CALL_LOG to Play once without a single warning. Reading the wiring is
// not enough to catch it, so the build is the gate, and it checks the *merged* manifest because that
// is the only artifact that reflects what actually ships.
ext.playForbiddenPermissions = [
        'android.permission.READ_CALL_LOG',
        'android.permission.WRITE_CALL_LOG',
        'android.permission.PROCESS_OUTGOING_CALLS',
        'android.permission.CALL_PHONE',
        'android.permission.SEND_SMS',
        'android.permission.READ_SMS',
        'android.permission.RECEIVE_SMS',
]

tasks.configureEach { theTask ->
    if (theTask.name != 'processBundleAfatReleaseMainManifest') {
        return
    }
    theTask.doLast {
        def mergedDir = layout.buildDirectory.dir('intermediates/merged_manifest/bundleAfatRelease').get().asFile
        def merged = fileTree(mergedDir).matching { include '**/AndroidManifest.xml' }.files.find()
        if (merged == null) {
            throw new GradleException(
                    "Play manifest guard: no merged manifest under ${mergedDir}, so the guard cannot " +
                    "verify what ships. Refusing to build a Play bundle it has not checked.")
        }
        // Parse rather than grep. A component may legitimately carry android:permission="CALL_PHONE"
        // to *require* that permission of its callers (org.telegram.ui.CallsActivity does exactly
        // that) — which is the opposite of requesting it. Only <uses-permission> entries decide what
        // the app asks for, and only those are what Play reads.
        def root = new groovy.xml.XmlSlurper(false, false).parse(merged)
        def requested = []
        root.'uses-permission'.each { requested << it.@'android:name'.toString() }
        root.'uses-permission-sdk-23'.each { requested << it.@'android:name'.toString() }
        def offenders = project.ext.playForbiddenPermissions.findAll { requested.contains(it) }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "Play bundle declares permissions Google Play rejects for a non-dialer app:\n" +
                    offenders.collect { "  - ${it}" }.join('\n') + "\n\n" +
                    "These belong to the direct-download build only. Check that bundleAfatRelease still\n" +
                    "maps to config/release/AndroidManifest.xml — see the 'Manifest per distribution\n" +
                    "channel' block in TMessagesProj_App/build.gradle.\n" +
                    "Merged manifest: ${merged}")
        }
    }
}
