#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=85
APP_VERSION_NAME=1.1.42
APP_PACKAGE=uz.svipe.app
IS_PRIVATE=false
# Google Maps Android API key — the VALUE LIVES IN apikeys.properties, which is git-ignored.
# It used to sit here, and this file is committed to a public repo, so the old key leaked and was
# rotated. Keep this entry EMPTY: it exists only so a clean clone configures (Gradle needs the
# property to be defined), and TMessagesProj_App/build.gradle prefers apikeys.properties over it.
# The key is injected into config/*/AndroidManifest*.xml as the ${MAPS_API_KEY} placeholder and is
# restricted in the Svipe Google Cloud project to uz.svipe.app (+.web/.beta) and the upload +
# Play App Signing SHA-1s. A release build with no key fails the manifest guard in that build.gradle.
MAPS_API_KEY=
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx4096M
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
