# Which JVM the Gradle daemon itself runs on. Committed on purpose: without it the daemon runs on
# whatever JAVA_HOME happens to be, which is how this build broke — Android Studio auto-updated its
# bundled JBR to Java 25 and every Gradle task started failing at configuration time with
#   A problem occurred configuring project ':buildSrc'.  > 25.0.2
#   Caused by: java.lang.IllegalArgumentException: 25.0.2
#     at org.jetbrains.kotlin.com.intellij.util.lang.JavaVersion.parse
# (the Kotlin compiler embedded in Gradle 8.13 cannot parse the JBR's "25.0.2+-15348964-b329.117"
# version string, and Gradle 8.13 does not support Java 25 anyway).
#
# 21 is the newest LTS supported by all four of Gradle 8.13, AGP 8.13.2, Kotlin 2.3.21 and R8.
# Keep this in sync with the JDK in the release Dockerfile.
toolchainVersion=21
