// Reads Telegram API credentials from a git-ignored apikeys.properties.
// Falls back to the public dummy values if the file/key is absent, so a
// clean clone still compiles (it just won't authenticate against Telegram).
def getApiKey(String propName, String defValue) {
    def propsFile = rootProject.file('apikeys.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        def value = props[propName]
        if (value != null && value.toString().trim().length() > 0) {
            return value.toString().trim()
        }
    }
    return defValue
}

def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}
apply plugin: 'com.google.gms.google-services'

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

// Every string Svipe adds has to follow the user's Telegram language. Nothing else enforces that —
// a missing values-uz entry or a literal typed straight into Java both build fine and only surface
// as English (or Uzbek) text in front of the wrong user. So the build is the gate.
task checkSvipeStrings(type: Exec) {
    workingDir rootDir
    commandLine 'python3', "${rootDir}/Tools/check_svipe_strings.py"
    // Never fail a build over a missing python3 or a detached git checkout — this guards our own
    // strings, it is not a toolchain requirement.
    ignoreExitValue = false
    doFirst {
        if (!file("${rootDir}/Tools/check_svipe_strings.py").exists()) {
            throw new StopExecutionException("guard script missing")
        }
    }
}

preBuild.dependsOn checkVisibility
preBuild.dependsOn checkSvipeStrings